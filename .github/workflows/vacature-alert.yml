name: Vacature-alert

on:
  schedule:
    - cron: "0 6 * * *"   # elke dag om 06:00 UTC = 08:00 zomertijd / 07:00 wintertijd
  workflow_dispatch:       # handmatig starten via het tabblad Actions
    inputs:
      modus:
        description: "Wat wil je doen?"
        type: choice
        default: normaal
        options: [normaal, test-melding, test-feeds, droog, stil]

permissions:
  contents: write          # nodig om gezien.json bij te werken

concurrency:
  group: vacature-alert    # nooit twee runs tegelijk; een tweede wacht netjes
  cancel-in-progress: false

jobs:
  zoek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Zoek nieuwe vacatures
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "${{ github.event.inputs.modus }}" in
            test-melding) ARG="--test-melding" ;;
            test-feeds)   ARG="--test-feeds" ;;
            droog)        ARG="--droog" ;;
            stil)         ARG="--stil" ;;
            *)            ARG="" ;;
          esac
          python3 vacature_alert.py $ARG

      - name: Onthoud gemelde vacatures
        if: always()
        run: |
          if [ -f gezien.json ]; then
            git config user.name "vacature-alert"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gezien.json
            if ! git diff --cached --quiet; then
              git commit -m "Gemelde vacatures bijgewerkt"
              # haal eerst wijzigingen op die intussen zijn gedaan (bijv. nieuwe links)
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
